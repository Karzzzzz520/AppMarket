name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "doc/*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show keystore
        run: ls -la keystore.jks && keytool -list -keystore keystore.jks -storepass 123456 | head -5

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:android:assembleRelease --stacktrace
          APK=$(find app/android/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "APK_FILE=$APK" >> $GITHUB_ENV
          ls -la "$APK"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASS: "123456"
          KEY_ALIAS: "appmarket"
          KEY_PASSWORD: "123456"

      - name: Upload APK Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_FILE }}
          archive: false
